[project]
name = "artefact-ai"
version = "0.1.0"
description = "Customer service assistant for Empório da Música"
readme = "README.md"
authors = [
    { name = "Artur", email = "a.vinicius0042@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-ai>=2.65.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "typer>=0.27.3",
]

[project.scripts]
artefact-ai = "artefact_ai:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"
