services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-artefact_ai}
      POSTGRES_USER: ${POSTGRES_USER:-artefact}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/001_extensions.sql:/docker-entrypoint-initdb.d/001_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:
